name: Create Release
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
      - name: Build and Upload Artifact for the Release
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
    
      - name: Build PlatformIO Project
        run: pio run
    
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware.bin
          path: .pio/build/esp32c3/
          
  create_release:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all 
    steps:
      - name: Grab built Artifact
        uses: actions/download-artifact@v8
        with:
          name: firmware.bin

      - name: Rename Artifact
        run: mv firmware.bin ESP32-C3-SuperMini-V2.2.2.bin
          
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.2.2 
          name: FPVShutter v2.2.2
          files: ESP32-C3-SuperMini-V2.2.2.bin
          prerelease: false
          generate_release_notes: true
          token: ${{ github.token }}
  
